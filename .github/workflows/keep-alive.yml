name: Supabase Keep Alive

on:
  schedule:
    # 每天北京时间早上 8:00 自动运行一次 (UTC 时间 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允许你在 GitHub 页面上手动点击运行测试

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send Ping Request to Supabase
        run: |
          curl -X GET "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/" \
          -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}"